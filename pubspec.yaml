name: cleanbev
description: A command-line tool that detects and safely removes unused assets
  from Dart and Flutter projects. Scans for asset references and prompts for
  confirmation before deletion.
version: 1.0.0
homepage: 'https://github.com/koukibadr/cleanbev-package'

environment:
  sdk: '>=2.12.0 <4.0.0'

# Add regular dependencies here.
dependencies:
  args: ^2.7.0
  file: ^7.0.1
  yaml: ^3.1.3
  interact_cli: ^2.4.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
