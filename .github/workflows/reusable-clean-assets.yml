name: Reusable - Clean Unused Assets

on:
  workflow_call:
    inputs:
      assets-path:
        description: "Path to the assets directory to scan"
        type: string
        default: "assets"
      working-directory:
        description: "Directory containing pubspec.yaml"
        type: string
        default: "."
      blocking:
        description: "Fail the workflow when unused assets are found"
        type: boolean
        default: false
    outputs:
      unused-count:
        description: "Number of unused assets detected"
        value: ${{ jobs.check-assets.outputs.unused-count }}

jobs:
  check-assets:
    runs-on: ubuntu-latest
    outputs:
      unused-count: ${{ steps.cleanbev.outputs.unused-count }}
    steps:
      - uses: actions/checkout@v4

      - name: Run cleanbev
        id: cleanbev
        uses: koukibadr/cleanbev-package/.github/actions/cleanbev-check@main
        with:
          assets-path: ${{ inputs.assets-path }}
          working-directory: ${{ inputs.working-directory }}
          blocking: ${{ inputs.blocking }}

      - name: Fail when blocking is enabled
        if: ${{ inputs.blocking && steps.cleanbev.outputs.unused-count != '0' && steps.cleanbev.outputs.unused-count != '' }}
        shell: bash
        run: |
          echo "Detected ${{ steps.cleanbev.outputs.unused-count }} unused assets, please run cleanbev locally and push changes again" >&2
          exit 1

      - name: Commit deletions
        if: inputs.mode == 'delete'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: remove unused assets (cleanbev)"
