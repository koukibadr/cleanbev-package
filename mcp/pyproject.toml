[project]
name = "cleanbev-mcp"
version = "0.1.2"
description = "MCP server for cleanbev – clean unused Flutter assets via AI tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
cleanbev-mcp = "cleanbev_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cleanbev_mcp"]